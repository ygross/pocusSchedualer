<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>דוח התנגשויות</title>
  <link rel="stylesheet" href="css/Leadshared.css?v=5" />
  <script>(function(){var t=localStorage.getItem('theme')||'dark';document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');window.addEventListener('message',function(e){if(e.data&&e.data.type==='theme')document.documentElement.setAttribute('data-theme',e.data.value)})})();</script>
</head>
<body>
<div class="wrap">
  <div class="purpose">דוח התנגשויות — מדריכים המשובצים לשתי פעילויות חופפות בזמן. מציג רק פעילויות עתידיות.</div>

  <header class="topbar">
    <div class="title-card">
      <div class="title">⚡ דוח התנגשויות</div>
      <div class="subtitle">שיבוצים כפולים · חפיפת זמנים</div>
    </div>
    <div class="user-card">
      <div class="user-info">
        <div class="user-label">מחובר</div>
        <div class="user-name" id="meName">…</div>
        <div class="user-role" id="meRole"></div>
      </div>
      <button id="themeToggle" class="theme-btn" type="button">🌙</button>
    </div>
  </header>

  <div class="stats-row">
    <div class="stat-card"><div class="stat-label">התנגשויות</div><div id="statConflicts" class="stat-value red">0</div></div>
    <div class="stat-card"><div class="stat-label">מדריכים מעורבים</div><div id="statInstructors" class="stat-value amber">0</div></div>
  </div>

  <div class="toolbar-row">
    <button id="refreshBtn" class="btn btn-secondary" type="button">🔄 רענן</button>
    <span id="summaryLine" class="summary-line"></span>
  </div>

  <div id="pageMsg" class="msg" style="display:none"></div>

  <div id="conflictsList"></div>
</div>
<script src="js/LeadConflictReport.js?v=1"></script>
<script src="js/page-collapse.js"></script>
<script src="js/page-timestamp.js"></script>
</body>
</html>
