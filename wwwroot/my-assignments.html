<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>השיבוצים שלי – PocusSchedualer</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    body { margin: 0; padding: 0; background: transparent; }
    #loading { padding: 24px; color: var(--c-hint, #9ca3af); }
    #errorMsg { display: none; }
    .hours-cell { white-space: nowrap; }
    .summary-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
    .filter-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 14px; }
    .filter-row .field { display: flex; flex-direction: column; gap: 4px; }
    .filter-row label { font-size: 13px; color: var(--c-hint, #6b7280); }
    .month-btns { display: flex; gap: 6px; }
  </style>
</head>
<body>
<div class="card" style="margin: 16px">
  <h2 style="margin-top:0">השיבוצים שלי</h2>

  <!-- Filters -->
  <div class="filter-row">
    <div class="field">
      <label>חיפוש חופשי</label>
      <input id="q" type="search" placeholder="שם פעילות / סוג / קורס…">
    </div>
    <div class="field">
      <label>חודש</label>
      <div class="month-btns">
        <button class="btn light" id="btnThis">חודש נוכחי</button>
        <button class="btn light" id="btnNext">חודש הבא</button>
        <button class="btn light" id="btnAll">הכל</button>
      </div>
    </div>
  </div>

  <div id="loading">טוען שיבוצים…</div>
  <div id="errorMsg" class="msg error"></div>

  <table id="tblAssignments" style="display:none">
    <thead>
      <tr>
        <th>תאריך</th>
        <th>שעה</th>
        <th>פעילות</th>
        <th>סוג</th>
        <th>קורס</th>
        <th>מרכז</th>
        <th class="hours-cell">שעות</th>
      </tr>
    </thead>
    <tbody id="tblBody"></tbody>
  </table>

  <div id="emptyMsg" class="hint" style="display:none; padding:20px 0">
    אין שיבוצים להצגה לפי הפילטר הנוכחי.
  </div>

  <!-- Summary -->
  <div class="summary-bar">
    <span class="badge" id="totalHours" style="background:#22c55e;color:#fff">0 שעות</span>
    <span class="badge" id="totalCount" style="background:var(--c-primary,#3b82f6);color:#fff">0 שיבוצים</span>
    <span class="hint" id="filterNote"></span>
  </div>
</div>

<script>
(() => {
  "use strict";

  const API = "api/assignments/my";

  const now       = new Date();
  const thisMonth = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
  const nm        = new Date(now.getFullYear(), now.getMonth()+1, 1);
  const nextMonth = `${nm.getFullYear()}-${String(nm.getMonth()+1).padStart(2,"0")}`;

  let allData     = [];
  let monthFilter = "all";

  document.getElementById("q").addEventListener("input", applyFilter);
  document.getElementById("btnThis").addEventListener("click", () => setMonth("this"));
  document.getElementById("btnNext").addEventListener("click", () => setMonth("next"));
  document.getElementById("btnAll").addEventListener("click",  () => setMonth("all"));

  async function load() {
    show("loading"); hide("errorMsg"); hide("emptyMsg"); hide("tblAssignments");
    try {
      const res = await fetch(API, { credentials: "include", cache: "no-cache" });
      if (res.status === 401) throw new Error("אין הרשאה – אנא התחבר מחדש");
      if (!res.ok)            throw new Error(`שגיאת שרת (${res.status})`);
      allData = await res.json();
      hide("loading");
      applyFilter();
    } catch (err) {
      hide("loading");
      const el = document.getElementById("errorMsg");
      el.textContent = err.message || "שגיאה בטעינת הנתונים";
      show("errorMsg");
    }
  }

  function setMonth(v) { monthFilter = v; applyFilter(); }

  function applyFilter() {
    const q = (document.getElementById("q").value || "").trim().toLowerCase();
    const filtered = allData.filter(a => {
      if (monthFilter !== "all") {
        const key = utcToMonthKey(a.startUtc);
        if (monthFilter === "this" && key !== thisMonth) return false;
        if (monthFilter === "next" && key !== nextMonth) return false;
      }
      if (q) {
        const hay = `${a.activityName} ${a.typeName} ${a.courseName ?? ""} ${a.leadInstructorName ?? ""}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    renderTable(filtered);
    document.getElementById("filterNote").textContent =
      monthFilter === "this" ? `(חודש נוכחי – ${thisMonth})` :
      monthFilter === "next" ? `(חודש הבא – ${nextMonth})` : "(כל השיבוצים)";
  }

  function renderTable(list) {
    const tbody = document.getElementById("tblBody");
    tbody.innerHTML = "";

    if (list.length === 0) {
      hide("tblAssignments"); show("emptyMsg");
      document.getElementById("totalHours").textContent = "0 שעות";
      document.getElementById("totalCount").textContent = "0 שיבוצים";
      return;
    }

    hide("emptyMsg"); show("tblAssignments");
    let totalHours = 0;

    list.forEach(a => {
      const start = new Date(a.startUtc);
      const end   = new Date(a.endUtc);
      const hours = Math.round((end - start) / 36e5 * 10) / 10;
      totalHours += hours;

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${esc(toDate(a.startUtc))}</td>
        <td>${esc(toTimeRange(start, end))}</td>
        <td>${esc(a.activityName)}</td>
        <td>${esc(a.typeName)}</td>
        <td>${esc(a.courseName ?? "—")}</td>
        <td>${esc(a.leadInstructorName ?? "—")}</td>
        <td class="hours-cell">${hours}</td>
      `;
      tbody.appendChild(tr);
    });

    document.getElementById("totalHours").textContent = `${Math.round(totalHours * 10) / 10} שעות`;
    document.getElementById("totalCount").textContent = `${list.length} שיבוצים`;
  }

  function utcToMonthKey(utcStr) {
    if (!utcStr) return "";
    try {
      const d = new Date(utcStr);
      const parts = new Intl.DateTimeFormat("en-CA", {
        year: "numeric", month: "2-digit", timeZone: "Asia/Jerusalem"
      }).formatToParts(d);
      return `${parts.find(p=>p.type==="year")?.value}-${parts.find(p=>p.type==="month")?.value}`;
    } catch { return ""; }
  }

  function toDate(utcStr) {
    if (!utcStr) return "—";
    try {
      return new Date(utcStr).toLocaleDateString("he-IL", {
        day: "2-digit", month: "2-digit", year: "numeric", timeZone: "Asia/Jerusalem"
      });
    } catch { return utcStr.substring(0, 10); }
  }

  function toTimeRange(start, end) {
    const o = { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Jerusalem" };
    try {
      return `${start.toLocaleTimeString("he-IL", o)}–${end.toLocaleTimeString("he-IL", o)}`;
    } catch { return ""; }
  }

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, c =>
      ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])
    );
  }

  function show(id) { const el = document.getElementById(id); if (el) el.style.display = ""; }
  function hide(id) { const el = document.getElementById(id); if (el) el.style.display = "none"; }

  load();
})();
</script>
</body>
</html>
