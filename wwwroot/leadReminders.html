<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>שליחת הודעה / תזכורת</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/lead.css?v=2">
  <link rel="stylesheet" href="css/shared.css?v=5" />
  <script>(function(){var t=localStorage.getItem('theme');document.addEventListener('DOMContentLoaded',function(){if(t!=='light')document.body.classList.add('theme-dark')});window.addEventListener('message',function(e){if(e.data&&e.data.type==='theme')document.body.classList.toggle('theme-dark',e.data.value==='dark')})})();</script>
</head>
<body class="app-page">

  <div class="page-purpose">
    ייעוד הדף: שליחת הודעה / תזכורת מרכז קורס — בחר קורס, פעילות ומופע ושלח הודעה לכל המדריכים המשובצים.
  </div>

  <div class="page-title-row">
    <div class="page-title">שליחת הודעה / תזכורת</div>
    <div class="page-user">
      <div class="muted">משתמש מחובר:</div>
      <div id="meLabel" class="strong">טוען…</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">בחירת קורס ומופע</div>

    <div class="grid grid-3">

      <div class="form-group">
        <label>קורס <span style="color:var(--bad)">*</span></label>
        <select id="courseSelect" class="input">
          <option value="">— בחר קורס —</option>
        </select>
      </div>

      <div class="form-group">
        <label>פעילות <span style="color:var(--bad)">*</span></label>
        <select id="activitySelect" class="input" disabled>
          <option value="">— קודם בחר קורס —</option>
        </select>
      </div>

      <div class="form-group">
        <label>מופע <span style="color:var(--bad)">*</span></label>
        <select id="instanceSelect" class="input" disabled>
          <option value="">— קודם בחר פעילות —</option>
        </select>
      </div>

    </div>

    <div id="instanceInfo" class="hint" style="display:none"></div>
  </div>

  <div class="card">
    <div class="card-title">הודעה</div>

    <div class="form-group">
      <label>נושא המייל (אופציונלי)</label>
      <input id="msgSubject" class="input" type="text" placeholder="השאר ריק לנושא ברירת מחדל…" />
      <div class="hint">ברירת מחדל: "הודעה ממרכז קורס: [שם פעילות] | [תאריך]"</div>
    </div>

    <div class="form-group" style="margin-top:14px">
      <label>תוכן ההודעה <span style="color:var(--bad)">*</span></label>
      <textarea id="msgBody" class="input" rows="5" placeholder="כתוב את ההודעה כאן…" style="resize:vertical"></textarea>
    </div>

    <div class="form-group" style="margin-top:14px">
      <label>ערוץ שליחה</label>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:6px">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="radio" name="channel" value="email" checked /> מייל
        </label>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="radio" name="channel" value="whatsapp" /> ווטסאפ
        </label>
      </div>
    </div>

    <div class="btn-row right" style="margin-top:16px">
      <button id="sendBtn" class="btn btn-primary" type="button">שלח הודעה</button>
    </div>

    <div id="resultBox" class="msg" style="margin-top:12px;display:none"></div>
  </div>

  <script src="js/leadReminders.js?v=2"></script>
  <script src="js/page-collapse.js"></script>
  <script src="js/page-timestamp.js"></script>
</body>
</html>
