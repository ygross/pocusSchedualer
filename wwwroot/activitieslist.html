<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>רשימת פעילויות – מדריך</title>
  <link rel="stylesheet" href="css/activitieslist.css?v=2" />
  <script>
    (function(){
      const t = localStorage.getItem('theme');
      if (t === 'dark') document.body && document.body.classList.add('theme-dark');
      document.addEventListener('DOMContentLoaded', function(){
        if (t === 'dark') document.body.classList.add('theme-dark');
      });
      window.addEventListener('message', function(e){
        if (e.data && e.data.type === 'theme') {
          document.body.classList.toggle('theme-dark', e.data.value === 'dark');
        }
      });
    })();
  </script>
<link rel="stylesheet" href="css/shared.css?v=5" />
</head>

<body>
  <div class="wrap">
    <div class="purpose">ייעוד הדף: רשימת השיבוצים והזמינויות של המדריך לפי חודש + הצגת הסמכות והפקת קלנדר (ICS).</div>

    <!-- TOPBAR – collapsible via page-collapse.js -->
    <div class="topbar">
      <div class="right-card">
        <div class="page-title">רשימת פעילויות</div>
        <span id="apiBase" style="display:none"></span>
      </div>

      <div class="left-card">
        <div>
          <div class="me-label">משתמש מחובר</div>
          <div class="me-line">שם: <b id="meName">טוען…</b></div>
          <div class="me-line">תפקיד: <b id="meRole">…</b></div>
        </div>
        <button id="themeToggle" class="theme-btn" type="button" title="בהיר / כהה">🌙</button>
      </div>
    </div>

    <!-- CONTROLS PANEL -->

    <div class="ctrl-panel">
      <input id="monthPicker" type="month" style="display:none" />
      <div class="ctrl-row">
        <button class="btn active-filter" id="btnThisMonth" type="button">חודש נוכחי</button>
        <button class="btn" id="btnPrevMonth" type="button">◀ חודש קודם</button>
        <button class="btn" id="btnNextMonth" type="button">חודש הבא ▶</button>

        <div class="ctrl">
          <label for="activityTypeId">סוג פעילות</label>
          <select id="activityTypeId"><option value="">הכל</option></select>
        </div>

        <div class="ctrl" title="ברירת מחדל: רק זמינויות/שיבוצים שלי. סמן כדי להציג גם מופעים חדשים.">
          <input id="chkShowAll" type="checkbox" />
          <label for="chkShowAll">הצג גם מופעים חדשים</label>
        </div>

        <button class="btn" id="btnReload" type="button">רענן</button>
        <button class="btn" id="btnIcs" type="button" title="מוריד קובץ ICS של השיבוצים שלך בחודש הנבחר">שלח קלנדר (ICS)</button>
      </div>
      <div id="status" class="msg">טוען…</div>
    </div>

    <!-- CERTIFICATIONS PANEL -->
    <div class="cert-panel">
      <div class="cert-title">ההסמכות שלי</div>
      <div id="certChips" class="chips"></div>
    </div>

    <!-- ACTIVITY LIST -->
    <div class="sectionTitle">
      <div>זמינויות + שיבוצים שלי בחודש</div>
      <div class="sub" id="countLine">—</div>
    </div>

    <div id="list" class="list"></div>
  </div>

  <script src="js/activitiesList.js?v=3"></script>
  <script src="js/page-collapse.js"></script>
  <script src="js/page-timestamp.js"></script>
</body>
</html>
