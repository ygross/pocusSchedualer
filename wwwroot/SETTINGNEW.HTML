<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>System Settings – SimPocus</title>
  <link rel="stylesheet" href="css/settings.css" />
  <script>(function(){var t=localStorage.getItem('theme');if(t!=='light')document.addEventListener('DOMContentLoaded',function(){document.body.classList.add('theme-dark')});window.addEventListener('message',function(e){if(e.data&&e.data.type==='theme')document.body.classList.toggle('theme-dark',e.data.value==='dark')})})();</script>
<link rel="stylesheet" href="css/shared.css?v=4" />
</head>
<body>
  <div class="wrap">

    <div class="topbar">
      <div>
        <div class="page-purpose">Page purpose: Admin-only system settings — Email, WhatsApp, Availability, Cancellations and System. Changes take effect immediately.</div>
        <div class="page-title">SimPocus Scheduler · System Settings</div>
        <div class="page-sub">Admin only · Changes take effect immediately</div>
      </div>
      <div class="user-info">
        <div id="meLine">Loading...</div>
        <div id="apiLine" style="font-size:11px;opacity:.7"></div>
      </div>
    </div>

    <div id="globalMsg" class="msg" style="display:none"></div>

    <div id="catsGrid" class="cats-grid">
      <div class="cat-card" style="grid-column:1/-1;padding:18px;color:var(--muted);font-size:14px">Loading settings...</div>
    </div>

  </div>
  <script src="js/settings.js"></script>
  <script src="js/page-collapse.js"></script>
  <script src="js/page-timestamp.js"></script>
</body>
</html>
