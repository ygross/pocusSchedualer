<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>דיווח תקלה — simCenterSchedualer</title>
<script>(function(){var t=localStorage.getItem('theme')||'dark';document.documentElement.setAttribute('data-theme',t);window.addEventListener('message',function(e){if(e.data&&e.data.type==='theme')document.documentElement.setAttribute('data-theme',e.data.value)})})();</script>
<link rel="stylesheet" href="css/shared.css?v=5"/>
<style>
:root{
  --bg:#0b1220;--panel:rgba(255,255,255,.06);--txt:#eaf0ff;
  --muted:rgba(255,255,255,.60);--muted2:rgba(255,255,255,.38);
  --line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.14);
  --blue:#3b82f6;--green:#22c55e;--red:#fb7185;--amber:#f59e0b;
  --shadow:0 10px 28px rgba(0,0,0,.35);
  --input-bg:rgba(255,255,255,.06);--input-border:rgba(255,255,255,.14);
}
:root[data-theme="light"]{
  --bg:#f0f4fb;--panel:rgba(255,255,255,.92);--txt:#0f172a;
  --muted:#475569;--muted2:#94a3b8;--line:rgba(15,23,42,.09);--line2:rgba(15,23,42,.15);
  --shadow:0 8px 20px rgba(15,23,42,.10);
  --input-bg:#fff;--input-border:rgba(15,23,42,.20);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:Heebo,Arial,sans-serif;direction:rtl;
  background:radial-gradient(900px 400px at 70% 0%,rgba(251,113,133,.10),transparent 55%),
             radial-gradient(600px 300px at 10% 80%,rgba(59,130,246,.07),transparent 55%),var(--bg);
  color:var(--txt);min-height:100vh;padding:20px 16px 60px;
}
.wrap{max-width:640px;margin:0 auto}

.topbar{display:flex;align-items:center;gap:14px;
  background:var(--panel);border:1px solid var(--line2);border-radius:16px;
  padding:16px 20px;box-shadow:var(--shadow);margin-bottom:20px}
.bug-icon{font-size:2rem;line-height:1}
.top-text .title{font-size:1.2rem;font-weight:700}
.top-text .sub{font-size:12px;color:var(--muted);margin-top:2px}
.theme-btn{margin-right:auto;background:rgba(255,255,255,.07);border:1px solid var(--line2);
  color:var(--txt);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:15px;
  display:flex;align-items:center;justify-content:center}

.card{background:var(--panel);border:1px solid var(--line2);border-radius:16px;
  padding:24px;box-shadow:var(--shadow);margin-bottom:16px}

label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px;margin-top:14px}
label:first-child{margin-top:0}

input[type=text],input[type=email],textarea{
  width:100%;background:var(--input-bg);border:1px solid var(--input-border);
  border-radius:10px;color:var(--txt);font-family:inherit;font-size:14px;
  padding:10px 14px;outline:none;transition:border-color .15s;resize:vertical}
input[type=text]:focus,input[type=email]:focus,textarea:focus{
  border-color:var(--blue);box-shadow:0 0 0 2px rgba(59,130,246,.2)}
textarea{min-height:130px}

.screenshot-zone{
  border:2px dashed var(--input-border);border-radius:12px;padding:20px;
  text-align:center;cursor:pointer;transition:border-color .15s,background .15s;
  position:relative;margin-top:6px}
.screenshot-zone:hover,.screenshot-zone.drag-over{
  border-color:var(--blue);background:rgba(59,130,246,.07)}
.screenshot-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.screenshot-zone .hint{font-size:13px;color:var(--muted2);pointer-events:none}
.screenshot-zone .hint strong{display:block;font-size:20px;margin-bottom:4px}

#previewBox{margin-top:10px;display:none}
#previewBox img{max-width:100%;border-radius:10px;border:1px solid var(--line2)}
#clearImg{margin-top:6px;background:none;border:1px solid var(--line2);color:var(--muted);
  border-radius:8px;padding:4px 12px;cursor:pointer;font-size:12px}
#clearImg:hover{border-color:var(--red);color:var(--red)}

.submit-btn{
  width:100%;padding:13px;font-size:15px;font-weight:700;border:none;
  border-radius:12px;cursor:pointer;margin-top:20px;
  background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff;
  transition:opacity .15s,transform .1s;letter-spacing:.3px}
.submit-btn:hover{opacity:.9}
.submit-btn:active{transform:scale(.98)}
.submit-btn:disabled{opacity:.5;cursor:not-allowed}

.result{display:none;margin-top:16px;border-radius:12px;padding:16px 18px;font-size:14px;font-weight:600}
.result.ok{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);color:var(--green)}
.result.err{background:rgba(251,113,133,.12);border:1px solid rgba(251,113,133,.3);color:var(--red)}

.footer-note{text-align:center;font-size:12px;color:var(--muted2);margin-top:20px}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="bug-icon">🐛</div>
    <div class="top-text">
      <div class="title">דיווח תקלה</div>
      <div class="sub">simCenterSchedualer · Bug Report</div>
    </div>
    <button id="themeToggle" class="theme-btn" type="button">🌙</button>
  </div>

  <div class="card">
    <form id="bugForm" novalidate>

      <label for="emailField">האימייל שלך (לצורך מענה) — אופציונלי</label>
      <input type="email" id="emailField" placeholder="your@email.com"/>

      <label for="msgField">תיאור הבעיה *</label>
      <textarea id="msgField" placeholder="פרט/י מה קרה, על איזה דף, ומה ציפית שיקרה..."></textarea>

      <label>צילום מסך — אופציונלי</label>
      <div class="screenshot-zone" id="dropZone">
        <input type="file" id="imgFile" accept="image/*"/>
        <div class="hint"><strong>📷</strong>גרור/י תמונה לכאן, או לחץ/י לבחירה</div>
      </div>
      <div id="previewBox">
        <img id="previewImg" src="" alt="תצוגה מקדימה"/>
        <button type="button" id="clearImg">✕ הסר תמונה</button>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">📤 שלח דיווח</button>
    </form>

    <div class="result" id="resultOk">✅ הדיווח נשלח בהצלחה! ניצור קשר בקרוב.</div>
    <div class="result" id="resultErr">❌ שגיאה בשליחה — נסה/י שוב מאוחר יותר.</div>
  </div>

  <div class="footer-note">הדיווח נשלח ישירות למנהל המערכת · simCenterSchedualer</div>
</div>

<script>
(function(){
  // Theme toggle
  const themeBtn = document.getElementById('themeToggle');
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('theme', t);
    themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  }
  applyTheme(localStorage.getItem('theme') || 'dark');
  themeBtn.addEventListener('click', ()=> applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'));

  // Screenshot
  let screenshotDataUrl = null;
  const imgFile    = document.getElementById('imgFile');
  const dropZone   = document.getElementById('dropZone');
  const previewBox = document.getElementById('previewBox');
  const previewImg = document.getElementById('previewImg');
  const clearBtn   = document.getElementById('clearImg');

  function setScreenshot(file){
    if (!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = e => {
      screenshotDataUrl = e.target.result;
      previewImg.src = screenshotDataUrl;
      previewBox.style.display = 'block';
    };
    reader.readAsDataURL(file);
  }
  imgFile.addEventListener('change', ()=> setScreenshot(imgFile.files[0]));
  dropZone.addEventListener('dragover', e=>{ e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', ()=> dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e=>{ e.preventDefault(); dropZone.classList.remove('drag-over'); setScreenshot(e.dataTransfer.files[0]); });
  clearBtn.addEventListener('click', ()=>{ screenshotDataUrl=null; previewBox.style.display='none'; imgFile.value=''; });

  // Clipboard paste
  document.addEventListener('paste', e=>{
    const item = Array.from(e.clipboardData.items).find(i=>i.type.startsWith('image/'));
    if (item) setScreenshot(item.getAsFile());
  });

  // API base detection (same pattern as other pages)
  const origin  = location.origin;
  const parts   = location.pathname.split('/').filter(Boolean);
  const appIdx  = parts.indexOf('PocusSchedualer');
  const baseDir = appIdx >= 0 ? '/' + parts.slice(0, appIdx+1).join('/') : '';
  const API_BASE = (sessionStorage.getItem('pocus_api_base'))
    || `${origin}${baseDir}/api/api`;

  // Submit
  const form      = document.getElementById('bugForm');
  const msgField  = document.getElementById('msgField');
  const emailField= document.getElementById('emailField');
  const submitBtn = document.getElementById('submitBtn');
  const okBox     = document.getElementById('resultOk');
  const errBox    = document.getElementById('resultErr');

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const msg = msgField.value.trim();
    if (!msg){ msgField.focus(); return; }

    submitBtn.disabled = true;
    submitBtn.textContent = '⏳ שולח...';
    okBox.style.display = errBox.style.display = 'none';

    try {
      const payload = {
        message:    msg,
        screenshot: screenshotDataUrl || null,
        pageUrl:    document.referrer || location.href,
        userEmail:  emailField.value.trim() || null
      };
      const r = await fetch(`${API_BASE}/bugreport`, {
        method:'POST', credentials:'include',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(payload)
      });
      if (r.ok){
        okBox.style.display = 'block';
        form.reset();
        screenshotDataUrl = null;
        previewBox.style.display = 'none';
      } else {
        errBox.style.display = 'block';
      }
    } catch {
      errBox.style.display = 'block';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = '📤 שלח דיווח';
    }
  });
})();
</script>
</body>
</html>
