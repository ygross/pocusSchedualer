<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Menu</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    body{margin:0;background:#0b2f63;color:#fff;font-family:system-ui,Segoe UI,Arial}
    .wrap{padding:18px 16px}
    .brand{font-weight:800;font-size:26px;letter-spacing:.2px;text-align:right}
    .sub{opacity:.85;margin-top:6px}
    .hr{height:1px;background:rgba(255,255,255,.22);margin:16px 0}
    .secTitle{opacity:.8;font-weight:700;margin:10px 0 8px}
    .btn{
      width:100%;border:0;border-radius:12px;padding:12px 12px;margin:7px 0;
      background:rgba(255,255,255,.10);color:#fff;font-weight:700;cursor:pointer;
      display:flex;align-items:center;justify-content:space-between;
    }
    .btn:hover{background:rgba(255,255,255,.16)}
    .foot{position:fixed;right:0;bottom:0;width:360px;padding:12px 16px;box-sizing:border-box;
      background:linear-gradient(to top, rgba(11,47,99,1), rgba(11,47,99,.88));
      border-top:1px solid rgba(255,255,255,.18)}
    .link{color:#fff;text-decoration:none;opacity:.9}
  </style>
<link rel="stylesheet" href="css/shared.css?v=5" />
</head>
<body>

<div class="wrap">
  <div class="brand"> simCenterSchedualer</div>
  <div class="sub">תפריט מערכת</div>

  <div class="hr"></div>

  <div class="secTitle">מדריך (Instructor)</div>

  <button class="btn" onclick="go('my-assignments.html')">
    <span>השיבוצים שלי</span><span>🧾</span>
  </button>

  <button class="btn" onclick="go('InstructorActivitiesCalendar.html')">
    <span>יומן פעילויות</span><span>🗓️</span>
  </button>

  <button class="btn" onclick="go('activitieslist.html')">
    <span>רשימת פעילויות</span><span>📋</span>
  </button>

  <div class="hr"></div>

  <div class="secTitle">מרכז קורס (CourseManager)</div>

  <button class="btn" onclick="go('LeadUpdateActivities.html')">
    <span>עריכת פעילות</span><span>✏️</span>
  </button>

  <button class="btn" onclick="go('leadassignment.html')">
    <span>שיבוץ פעילות</span><span>✅</span>
  </button>

  <button class="btn" onclick="go('LeadPendingAvailability.html')">
    <span>זמינות ממתינה</span><span>⏳</span>
  </button>

  <button class="btn" onclick="go('leadCalendar.html')">
    <span>קלנדר מרכז קורס</span><span>📆</span>
  </button>

  <button class="btn" onclick="go('leadReminders.html')">
    <span>שליחת הודעה / תזכורת</span><span>💬</span>
  </button>

  <div class="hr"></div>

  <div class="secTitle">אדמין (Admin)</div>

  <button class="btn" onclick="go('adminCoursesManagement.html')">
    <span>ניהול קורסים</span><span>📚</span>
  </button>

  <button class="btn" onclick="go('adminPendingApprovals.html')">
    <span>אישורים ממתינים</span><span>👤</span>
  </button>

  <button class="btn" onclick="go('adminBulkImport.html')">
    <span>ייבוא מדריכים מקובץ</span><span>📥</span>
  </button>

</div>

<div class="foot">
  <a class="link" href="#" onclick="go('guide.html');return false;">עזרה / מדריך למשתמש</a>
</div>

<script>
  function go(page){
    if (window.parent && typeof window.parent.loadPage === "function"){
      window.parent.loadPage(page);
    } else {
      location.href = page;
    }
  }
</script>

</body>
</html>
