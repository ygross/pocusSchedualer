<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>עדכון פרטים אישיים – simCenter Schedualer</title>
  <link rel="stylesheet" href="css/instructorUpdateDetails.css?v=3" />
  <script>(function(){var t=localStorage.getItem('theme')||'dark';document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');window.addEventListener('message',function(e){if(e.data&&e.data.type==='theme')document.documentElement.setAttribute('data-theme',e.data.value)})})();</script>
</head>
<body>
<div class="wrap">

  <div class="purpose">ייעוד הדף: עדכון פרטים אישיים – שם מלא, טלפון ומחלקה.</div>

  <!-- Topbar -->
  <div class="topbar">
    <div class="title-card">
      <div class="title">עדכון פרטים אישיים</div>
      <div class="subtitle">simCenter Schedualer</div>
    </div>
    <div class="user-card">
      <div class="user-label">משתמש מחובר</div>
      <div class="user-line">שם: <b id="meName">טוען…</b></div>
      <div class="user-line">תפקיד: <b id="meRole">…</b></div>
      <button id="themeToggle" class="theme-btn" type="button" title="בהיר / כהה">🌙</button>
    </div>
  </div>

  <!-- Form card -->
  <div class="card">
    <div class="card-title">✏️ פרטי המדריך</div>

    <div class="field">
      <label for="email">אימייל (לא ניתן לשינוי)</label>
      <input type="email" id="email" disabled />
    </div>

    <div class="field">
      <label for="fullName">שם מלא <span class="req">*</span></label>
      <input type="text" id="fullName" required placeholder="שם מלא" />
    </div>

    <div class="field">
      <label for="phone">טלפון</label>
      <input type="tel" id="phone" placeholder="050-0000000" />
    </div>

    <div class="field">
      <label for="department">מחלקה</label>
      <input type="text" id="department" placeholder="שם המחלקה" />
    </div>

    <div class="field">
      <label for="role">תפקיד</label>
      <input type="text" id="role" disabled />
    </div>

    <div id="msgBox" class="msg" style="display:none"></div>

    <div class="actions">
      <button id="btnSave" class="btn-primary" type="button">💾 שמור שינויים</button>
    </div>
  </div>

</div>
<script src="js/instructorUpdateDetails.js?v=3"></script>
<script src="js/page-timestamp.js"></script>
</body>
</html>
